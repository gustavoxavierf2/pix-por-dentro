spring.application.name=banco-recebedor
server.port=8081

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Se o processamento der erro: tenta 3 vezes e depois manda para a DLQ (sem loop infinito)
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Atraso artificial para dar tempo de ver a fila no painel do RabbitMQ
pix.atraso-processamento-ms=1500

# Esconde o stack trace gigante quando a mensagem vai para a DLQ (o log [DLQ] já explica)
logging.level.org.springframework.amqp.rabbit.listener.ConditionalRejectingErrorHandler=ERROR

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %msg%n
