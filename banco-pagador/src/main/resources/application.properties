spring.application.name=banco-pagador
server.port=8080
server.error.include-message=always

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Regra do Banco Central: entre 20h e 6h o limite padrão do Pix para pessoa física é R$ 1.000
pix.limite-noturno=1000.00
# true = finge que é noite, para demonstrar o bloqueio a qualquer hora
pix.forcar-horario-noturno=false

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %msg%n
